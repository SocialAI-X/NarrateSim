[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narratesim-studio"
version = "1.0.0"
description = "LLM-agent social network simulator for narrative attacks and defenses"
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
narratesim = "nsstudio.cli:main"

[tool.setuptools]
packages = ["nsstudio"]

[tool.setuptools.package-data]
nsstudio = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
